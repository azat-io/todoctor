[package]
name = "todoctor"
version = "1.0.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
cross = "0.2.5"
csv = "1.4.0"
futures = "0.3.34"
indicatif = "0.18.6"
lazy_static = "1.5.1"
open = "5.4.5"
oxc = "0.160.0"
regex = "1.13.2"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
mockall = "0.15.0"

[profile.release]
lto = true
